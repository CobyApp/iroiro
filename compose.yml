services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      /usr/bin/mc mb -p local/oshikore-products-dev || true;
      /usr/bin/mc anonymous set public local/oshikore-products-dev;
      /usr/bin/mc mb -p local/oshikore-ugc-dev || true;
      /usr/bin/mc ilm rule add local/oshikore-ugc-dev --expire-days 1 --prefix posts/tmp/ || true;
      exit 0;
      "

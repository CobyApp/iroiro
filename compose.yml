services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iroiro
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 카탈로그 DB(iroiro_catalog) 생성 — 빈 볼륨에서 최초 1회만 실행된다(db-reset.sh 도 보장).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d iroiro" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      /usr/bin/mc mb -p local/iroiro-products-dev || true;
      /usr/bin/mc anonymous set public local/iroiro-products-dev;
      /usr/bin/mc mb -p local/iroiro-ugc-dev || true;
      /usr/bin/mc ilm rule add local/iroiro-ugc-dev --expire-days 1 --prefix posts/tmp/ || true;
      /usr/bin/mc mb -p local/iroiro-catalog-dev || true;
      /usr/bin/mc anonymous set download local/iroiro-catalog-dev/cards/wm || true;
      exit 0;
      "

volumes:
  pgdata:

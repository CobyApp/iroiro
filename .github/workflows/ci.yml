name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches-ignore: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Prisma client types are generated, not committed — typecheck needs them.
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/iroiro
        run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

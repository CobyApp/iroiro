# Branch → environment mapping (docs/deployment.md):
#   dev  → GitHub environment "dev"        → dev.iroiro.club
#   main → GitHub environment "production" → iroiro.club
# Per-environment variables (Settings › Environments): AWS_ROLE_ARN, ECR_REPOSITORY,
# ECS_CLUSTER, ECS_SERVICE, NEXT_PUBLIC_VAPID_PUBLIC_KEY (optional). Repo variable: DEPLOY_ENABLED.
name: Deploy

on:
  push:
    branches: [dev, main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    # Repo-level gate (environment vars are not visible to a job-level if). infra/aws/setup.sh github
    # flips DEPLOY_ENABLED to true once the ECS services exist.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iroiro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d iroiro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Prisma client types are generated, not committed — typecheck needs them.
      # Two clients: commerce (prisma/schema.prisma) and the shared catalog DB (prisma/catalog.prisma).
      - name: Generate Prisma clients
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/iroiro
          CATALOG_DATABASE_URL: postgresql://catalog_app:app@localhost:5432/iroiro_catalog
        run: |
          npx prisma generate
          npx prisma generate --config prisma.catalog.config.ts

      - name: Validate
        run: npm run lint && npm run typecheck && npm run test

      # Prerendering touches the DB, so build against a throwaway schema-only Postgres.
      - name: Apply schema to build DB
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: iroiro
        run: |
          psql -v ON_ERROR_STOP=1 -q -f db/schema.sql
          psql -c "ALTER ROLE app WITH LOGIN PASSWORD 'app';"
          # Catalog DB (shared trading-card master) lives in its own database.
          psql -d postgres -c "CREATE DATABASE iroiro_catalog;"
          psql -d iroiro_catalog -v ON_ERROR_STOP=1 -q -f db/catalog-schema.sql
          psql -d iroiro_catalog -c "ALTER ROLE catalog_app WITH LOGIN PASSWORD 'app';"

      - name: Build
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/iroiro
          CATALOG_DATABASE_URL: postgresql://catalog_app:app@localhost:5432/iroiro_catalog
          # Build-time placeholders — real values are injected by ECS (SSM secrets) at runtime.
          KAKAO_REST_API_KEY: build-placeholder
          NAVER_CLIENT_ID: build-placeholder
          NAVER_CLIENT_SECRET: build-placeholder
          # Inlined into the client bundle, so it must be present at build time.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ENV_NAME: ${{ github.ref_name == 'main' && 'prd' || 'dev' }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY"
          docker build -t "$IMAGE:$ENV_NAME-${GITHUB_SHA::12}" -t "$IMAGE:$ENV_NAME-latest" .
          docker push --all-tags "$IMAGE"

      # Schema migrations run as a one-off Fargate task (task definition iroiro-migrate-<env>, registered by
      # infra/aws/setup.sh migrate) using the image just pushed. It applies pending `-- [section]`s of
      # db/schema.sql (commerce) and db/catalog-schema.sql (shared catalog) — see scripts/db-migrate.mjs.
      # Failing migrations stop the deploy before the service rolls.
      - name: Run DB migrations
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          ENV_NAME: ${{ github.ref_name == 'main' && 'prd' || 'dev' }}
        run: |
          VPC=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC" --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC" Name=group-name,Values=default --query 'SecurityGroups[0].GroupId' --output text)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE --task-definition "iroiro-migrate-$ENV_NAME" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "migrate task: $TASK"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          STREAM="migrate/migrate/${TASK##*/}"
          aws logs get-log-events --log-group-name "/ecs/iroiro-$ENV_NAME" --log-stream-name "$STREAM" --start-from-head \
            --query 'events[].message' --output text 2>/dev/null | sed 's/^/  | /' || true
          [ "$EXIT" = "0" ] || { echo "migration task exited with $EXIT" >&2; exit 1; }

      # The ECS Express service pins "<env>-latest"; a forced deployment pulls the new image.
      # (Deliberately not update-express-gateway-service — that reconciles the ALB and would drop
      # the custom-domain listener rules added by infra/aws/setup.sh domains.)
      - name: Deploy to ECS
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment --query 'service.deployments[0].id' --output text
          # Express blue/green rollouts (bake time) can exceed the waiter's built-in 10 min — allow up to 30.
          for i in 1 2 3; do
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE" && break
            [ "$i" = 3 ] && { echo "service not stable after 30 min" >&2; exit 1; }
            echo "still rolling out ($i/3)…"
          done
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].{running:runningCount,desired:desiredCount,status:status}' --output table
